# TEMPORARY probe — delete before merge. Not part of the shipped CI surface, and
# no actions.lock section, because it exists only to MEASURE two claims that
# issue #66 would otherwise land unverified (the deploy job cannot run on a
# branch: the github-pages environment's deployment branch policy is `main`).
#
#   1. `build` with ONLY `contents: read` can still upload the Pages artifact
#      (the restructure also drops the workflow-wide `actions: read`, so this is
#      the load-bearing question for the build half).
#   2. A job whose permissions block REPLACES the floor — `pages: write` +
#      `id-token: write`, nothing else — can mint an OIDC token, and genuinely
#      CANNOT read contents or actions. That is the semantics the fix relies on:
#      the grant is a replacement, not an addition.
#
# The negative controls are read-only API calls: no mutation, no state.
#
# MEASURED 2026-09-25: this file's runs, and every other workflow's runs, on a
# branch pushed by the Arena agent (actor arena-ai-coding-agent[bot]) come back
# `startup_failure` with ZERO jobs. The identical, unmodified zz-m1-plain-push.yml
# succeeds on main under actor=hyperpolymath and startup-fails on that branch, so
# the discriminator is the actor, not the diff. Until this runs under a permitted
# actor the two claims below are UNVERIFIED here — see PR #107.
name: ZZ Pages perms probe
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-shape:
    name: 'build shape (contents: read only)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Stage a site
        run: |
          mkdir -p _site
          printf '<!doctype html><title>probe</title>\n' > _site/index.html
      - name: Upload the Pages artifact with contents:read only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'
  deploy-shape:
    name: deploy shape (pages+id-token only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 'id-token: request endpoint available at job level'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "MISSING ACTIONS_ID_TOKEN_REQUEST_URL — id-token: write did not take effect"; exit 1
          fi
          echo "id-token endpoint present"
          code=$(curl -s -o /tmp/oidc.json -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=statistikles-perms-probe")
          echo "OIDC token mint HTTP ${code}"
          [ "${code}" = "200" ] || { cat /tmp/oidc.json; exit 1; }
          /usr/bin/env python3 -c "import json;d=json.load(open('/tmp/oidc.json'));print('token bytes:',len(d['value']))"
      - name: 'negative control: contents must NOT be readable from this job'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/README.adoc")
          echo "GET contents HTTP ${code} (expect 403 — the job-level block replaced the read floor)"
          [ "${code}" = "403" ] || exit 1
      - name: 'negative control: actions must NOT be readable from this job'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1")
          echo "GET actions/runs HTTP ${code} (expect 403)"
          [ "${code}" = "403" ] || exit 1
