# Diagnostic probe (see the zz-m1/m3/m5 matrix): does a workflow with NO `on:`
# key still start a job? That is the only variable this file is meant to carry.
#
# The echo string MUST stay quoted. Unquoted it is a YAML plain scalar
# containing `on: `, which is a syntax error: the file then fails to parse, and
# GitHub rejects the whole workflow at parse time. An unparseable probe cannot
# answer its own question — "no `on:` key" and "not valid YAML" both produce the
# same 0-job run — and it also turns the Dogfood Gate's "Workflows parse" job
# red (that job was red on main from #104 until this line was quoted).
name: ZZ M3 no on key
jobs:
  m3:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "M3 without on: ran"'
