#
# Statistikles — Zig FFI Build + Test
#
# The C-ABI FFI in ffi/zig is EXPERIMENTAL (placeholder ops, not yet backed by
# the Julia core), but it must compile and its memory-safety tests must pass so
# it cannot silently rot. Builds and tests against Zig 0.13.0 — the version the
# FFI's build.zig / source dialect targets.

name: Zig FFI

on:
  push:
    branches: [main]
    paths:
      - 'ffi/zig/**'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ffi/zig/**'
      - '.github/workflows/zig.yml'
  workflow_dispatch:

# Explicit rather than `read-all`: every job here only checks out and builds.
# Naming the one scope it needs also removes the last scalar `permissions:`
# block, which is what let a text-matching sweep produce invalid YAML twice
# (fixed #64, reintroduced #68, re-fixed #69).
permissions:
  contents: read

concurrency:
  group: zig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig-ffi:
    name: Zig FFI — build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.13.0

      - name: Build + test FFI
        working-directory: ffi/zig
        run: zig build test --summary all
