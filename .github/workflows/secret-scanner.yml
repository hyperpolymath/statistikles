# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Replaces an inline trufflehog job: trufflehog was retired
# estate-wide as redundant, and this repo had no other leak scanning, so the
# scanner is UPGRADED here rather than removed.
#
# `secrets: inherit` is REQUIRED — without it the gitleaks action's inner
# secrets.GITHUB_TOKEN is empty and the scan silently degrades.
name: 'Secret Scanner'
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # Re-pinned 2026-09-25 to the revision carried by the estate's own template
    # (rhodium-standard-repositories/.github/workflows/secret-scanner.yml). The
    # previous pin predates the shared allowlist: it had no way to inherit
    # config/gitleaks/estate-baseline.toml, so this Julia repo's public package
    # UUIDs and `git-tree-sha1` integrity hashes were reported as candidate
    # secrets on every run — and, because that pin also lacked `--verbose`, the
    # log named neither the rule nor the file. Together with the new pinned
    # `.gitleaks.toml` at the repo root this scan now inherits the estate
    # baseline; findings, if any remain, are named.
    #
    # The new revision also adds a gating full-history pass (fetch-depth: 0 on
    # its own checkout) and the AsciiDoc mirror pass is now past its grace
    # window (ENFORCE_ADOC_SCAN_FROM 2026-08-21), so this scan is strictly
    # wider than before — deliberately: it was red before, blind and unreadable.
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@210f14e753c80064ec1bcae72f1d654dd9b0e687
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write
