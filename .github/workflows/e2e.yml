#
# Statistikles — E2E + Aspect Tests
#
# Runs the Julia test suite, then the Agda proof gate.
#
# Counts are deliberately NOT stated here. The previous header claimed
# "693 @test assertions, 10 Agda proofs, 8 integrations"; measured on this tree
# it is 1129 `@test` occurrences under test/ and 3 Agda modules under proofs/ —
# wrong in both directions, and wrong again on the next commit that adds a test.
# The authoritative counts are whatever this job prints when it runs.

name: E2E + Aspect

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Explicit rather than `read-all`: every job here only checks out and builds.
# Naming the one scope it needs also removes the last scalar `permissions:`
# block, which is what let a text-matching sweep produce invalid YAML twice
# (fixed #64, reintroduced #68, re-fixed #69).
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-julia:
    name: E2E — Julia Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10'

      - name: Julia cache
        uses: julia-actions/cache@v3.3.0

      - name: Run Julia tests (with coverage)
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process coverage → lcov
        uses: julia-actions/julia-processcoverage@v1.2.2

      - name: Coverage summary
        if: always()
        run: |
          if [ -f lcov.info ]; then
            TOTAL=$(grep -c '^DA:' lcov.info || true)
            HIT=$(awk -F'[:,]' '/^DA:/ && $3 > 0 { c++ } END { print c + 0 }' lcov.info)
            TOTAL=${TOTAL:-0}
            HIT=${HIT:-0}
            if [ "$TOTAL" -gt 0 ]; then
              PCT=$(awk -v h="$HIT" -v t="$TOTAL" 'BEGIN { printf "%.2f", (h / t) * 100 }')
            else
              PCT="0.00"
            fi
            {
              echo "## Coverage (informational — not gated)"
              echo ""
              echo "Lines covered: **${HIT} / ${TOTAL}** (**${PCT}%**)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No lcov.info was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: julia-coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  aspect-safety:
    name: Aspect — Safety + SPDX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: No dangerous patterns
        run: |
          DANGEROUS=$(grep -rn 'believe_me\|assert_total\|sorry\|Admitted' src/ 2>/dev/null || true)
          if [ -n "$DANGEROUS" ]; then
            echo "FAIL: Dangerous patterns"
            echo "$DANGEROUS"
            exit 1
          fi
          # Experimental Agda proofs must stay constructive — no postulates.
          PROOF_POSTULATES=$(grep -rnw --include='*.agda' 'postulate' proofs/ 2>/dev/null || true)
          if [ -n "$PROOF_POSTULATES" ]; then
            echo "FAIL: postulate found under proofs/"
            echo "$PROOF_POSTULATES"
            exit 1
          fi
          echo "PASS: No dangerous patterns"

      - name: SPDX headers
        run: |
          MISSING=0
          for f in $(find src/ -name "*.jl" | head -20); do
            if ! head -3 "$f" | grep -q "SPDX"; then
              MISSING=$((MISSING + 1))
            fi
          done
          echo "Missing SPDX: $MISSING (of 20 sampled)"
