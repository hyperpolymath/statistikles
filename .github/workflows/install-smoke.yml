#
# Statistikles — Install Smoke Test
#
# Exercises the documented install path (QUICKSTART-USER.adoc) so it cannot
# silently rot: `just setup` must instantiate the environment, the package
# must load, and the Justfile must parse.

name: Install Smoke

on:
  push:
    branches: [main]
    paths:
      - 'Justfile'
      - 'Project.toml'
      - 'src/**'
      - '.tool-versions'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Explicit rather than `read-all`: every job here only checks out and builds.
# Naming the one scope it needs also removes the last scalar `permissions:`
# block, which is what let a text-matching sweep produce invalid YAML twice
# (fixed #64, reintroduced #68, re-fixed #69).
permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Smoke — Documented Install Path
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.10'

      - name: Julia cache
        uses: julia-actions/cache@v3.3.0

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      - name: Run documented install path
        run: just setup && julia --project=. -e 'using Statistikles' && just --list
